name: Release

# Manual-only: run from the Actions tab when you actually want to publish.
# Requires repo secret NPM_TOKEN and "Allow GitHub Actions to create and
# approve pull requests" (Settings → Actions → General). Until then, leaving
# this on `push` would fail and email on every commit.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          publish: npm publish --access public
          version: npx changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
